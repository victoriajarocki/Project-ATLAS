name: ATLAS CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ATLAS and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff linting
        run: ruff check .

      - name: Verify Ruff formatting
        run: ruff format --check .

      - name: Run mypy
        run: mypy src

      - name: Run pytest
        run: pytest